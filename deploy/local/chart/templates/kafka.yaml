{{- $kafka := .Values.kafka | default dict }}
{{- if $kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # The broker must reach its KRaft controller before the readiness probe passes.
  publishNotReadyAddresses: true
  selector:
    app: petclinic-kafka
  ports:
    - name: kafka
      port: 9092
    - name: controller
      port: 9093
    - name: jmx
      port: 9999
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: petclinic-kafka
spec:
  serviceName: kafka
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: petclinic-kafka
  template:
    metadata:
      labels:
        app: petclinic-kafka
        tags.datadoghq.com/env: local
        tags.datadoghq.com/service: petclinic-kafka
        admission.datadoghq.com/enabled: "false"
      annotations:
        ad.datadoghq.com/kafka.logs: '[{"source":"kafka","service":"petclinic-kafka"}]'
        ad.datadoghq.com/kafka.checks: >-
          {"kafka":{"init_config":{"is_jmx":true,"collect_default_metrics":true},"instances":[{"host":"%%host%%","port":9999,"tags":["env:local","service:petclinic-kafka"]}]},"kafka_consumer":{"init_config":{},"instances":[{"kafka_connect_str":"kafka.petclinic.svc.cluster.local:9092","consumer_groups":{"petclinic-customers":{"petclinic.visit-created":[0,1,2]}},"tags":["env:local","service:petclinic-kafka"]}]}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - {name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk"}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.petclinic.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_LOG_RETENTION_HOURS, value: "24"}
            - {name: KAFKA_LOG_RETENTION_BYTES, value: "134217728"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
            - {name: KAFKA_JMX_PORT, value: "9999"}
            - name: KAFKA_JMX_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: controller, containerPort: 9093}
            - {name: jmx, containerPort: 9999}
          startupProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 1536Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
{{- end }}
